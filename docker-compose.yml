services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://victoria:secret123@db:5432/practicedb
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: victoria
      POSTGRES_PASSWORD: secret123
      POSTGRES_DB: practicedb
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  db-data: